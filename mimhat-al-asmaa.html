<script>
(function(){
"use strict";
const DG='[0-9\\u0660-\\u0669\\u06F0-\\u06F9]', ND='(?![0-9\\u0660-\\u0669\\u06F0-\\u06F9])', NBD='(?<![0-9\\u0660-\\u0669\\u06F0-\\u06F9])';
const LT='\\p{L}\\p{M}';

function norm(s){
  return s.normalize('NFD').replace(/[̀-ًͯ-ٰٟـ]/g,'')
    .replace(/[اأإآٱ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي')
    .toLowerCase().replace(/\s+/g,' ').trim();

const S=str=>new Set(str.split(/\s+/).filter(Boolean).map(norm));

const AR_TITLES=S('السيد السيدة الأستاذ الأستاذة الدكتور الدكتورة المدعو المدعوة السي لالة لالا الحاج الحاجة المرحوم المرحومة الهالك الهالكة الطفل الطفلة الآنسة المسمى المسماة مولاي سيدي');
/* roles: never part of a name; a name may follow them */

const LA_TITLES=S('mr mrs ms miss m mme mlle dr me pr prof monsieur madame mademoiselle maitre maître sir docteur');
const AR_FIRST=S(`سعيد كريم عزيز رضا طه محمد أحمد محمود مصطفى يوسف يونس ياسين ياسر أيوب إبراهيم إسماعيل علي حسن حسين حمزة خالد رشيد سمير طارق عادل عثمان عمر عماد مراد مهدي المهدي نبيل هشام وليد زكرياء زكريا أنس إلياس آدم ريان سفيان سليمان عبدالله عبدالرحيم عبدالرحمن عبدالكريم عبدالعزيز عبداللطيف عبدالحق عبدالإله جمال جواد حميد خليل صلاح فؤاد لحسن الحسن الحسين امحمد منير نورالدين نوفل هاني وائل أسامة بلال توفيق إدريس بدر أشرف أيمن حاتم زهير سعد شعيب صهيب عزالدين عصام عبدالصمد عبدالمجيد عبدالقادر عبدالسلام كمال لؤي مالك ماجد مروان معاذ ناصر نزار هيثم يحيى يعقوب
فاطمة خديجة عائشة مريم زينب سلمى سارة حنان نادية نعيمة سعاد ليلى لطيفة رشيدة سميرة أمينة إيمان أسماء هاجر يسرى سهام صفاء نوال غيثة ياسمين رانيا إكرام شيماء كوثر هند حليمة مليكة نزهة ابتسام فدوى لبنى دنيا نهى سناء أميمة سكينة خولة رقية حفصة جيهان عزيزة فتيحة زهور ثورية سلوى مونية`);
const LA_FIRST=S(`mohamed mohammed mohammad muhammad mehdi ahmed ahmad youssef yousef youssouf younes youness yassine yassin yasser amine ayoub ibrahim brahim ismail abdellah abdallah abdelilah abderrahim abderrahmane abdelkader abdelaziz abdellatif abdelhak abdessamad abdeslam ali hassan hasan hussein houssam hamza khalid khaled rachid samir tarik tariq adil adel othmane othman omar imad karim mourad nabil hicham hisham walid zakaria zakariae anas ilyas ilias adam rayan soufiane sofiane souleymane jamal jawad hamid hakim reda salah taha fouad lahcen mounir noureddine nawfal naoufal badr bilal taoufik driss idriss achraf ayman hatim zouhair saad chouaib marouane mouad nasser hamid mustapha mustafa mahmoud
fatima fatim fatimazahra khadija aicha aisha meryem mariam maryam zineb zaineb salma sara sarah hanane nadia naima souad leila laila latifa rachida samira amina imane iman asmaa asma hajar yousra siham safae safaa nawal ghita yasmine yasmina rania ikram chaimae chaima kawtar kaoutar hind halima malika nezha ibtissam fadwa loubna dounia douae sanaa oumaima oumayma sakina khaoula rokaya hafsa jihane fatiha zhor touria mounia
john david michael james robert william marie jean pierre paul sophie anna maria julie nicolas thomas laura emma lucas louis claire`);
const AR_CONN=S('بن ابن بنت ولد بنت ايت آيت أيت أولاد ابو أبو بو عبد أم');
const LA_CONN=S('ben bent ould ait aït el al ibn abou abu bou de da van von bin');
const AR_STOP=S(`إنه أنه انه إنها أنها انها لا لم لن ما ماذا كما هناك هنا ليست كذلك أيضا جدا فقط قد كي لأن لان بأن بان وأن وان فإن عليه عليها عليهم عليهما له لها لهم لهما به بها بهم منه منها منهم عنه عنها عنهم إليه إليها إليهم معه معها معهم لديه لديها فيه فيها نفسه نفسها ذاته ذاتها أعلاه المذكور المذكورة السالف السالفة الذكر المحضر الشكاية الشكاية الدعوى الملف الحكم القرار العامة القضائية الملك وكيل
و في من على إلى الى عن مع هذا هذه ذلك تلك الذي التي الذين اللذين اللواتي قال قالت كان كانت يكون تكون ليس أن إن أو ثم حيث لدى عند بعد قبل منذ حتى كل بعض غير
يسكن تسكن الساكن الساكنة القاطن القاطنة المزداد المزدادة ازداد ازدادت البالغ البالغة عمره عمرها رقم هاتف هاتفه هاتفها بطاقة بطاقته بطاقتها عنوان عنوانه بتاريخ تاريخ يوم سنة شهر
المدير المديرة الطبيب الطبيبة المحامي المحامية الموظف الموظفة الحامل الحاملة بصفته بصفتها الأستاذ الأستاذة الطالب الطالبة التلميذ التلميذة الذي إذ إذا لكن بل قد لقد هو هي هم
حضر حضرت ذهب ذهبت جاء جاءت اتصل اتصلت صرح صرحت أكد أكدت أخبر أخبرت طلب طلبت قام قامت يعمل تعمل يبلغ تبلغ والد والدة زوج زوجة أخ أخت ابنه ابنته رفقة ضد لفائدة`);
const LA_STOP=S(`le la les un une des du de et ou mais donc or ni car à au aux en dans par pour sur avec sans sous chez the a an and or of to in on at for with by from is was il elle ils elles nous vous je tu
lundi mardi mercredi jeudi vendredi samedi dimanche janvier février fevrier mars avril mai juin juillet août aout septembre octobre novembre décembre decembre monday tuesday wednesday thursday friday saturday sunday january february march april may june july august september october november december
rue avenue boulevard maroc morocco france casablanca rabat marrakech fes fès tanger agadir oujda meknes kenitra tetouan`);

const AR_PREF=['وب','ول','فل','و','ف','ب','ل','ك'];
const isLatin=w=>/^[A-Za-zÀ-ɏ'’-]+$/.test(w);
const isCap=w=>/^[A-ZÀ-Þ]/.test(w);
const isAllCaps=w=>/^[A-ZÀ-Þ]{3,}$/.test(w);

function prefLen(n,set){
  if(set.has(n)) return 0;
  for(const p of AR_PREF){ if(n.length>p.length+1 && n.startsWith(p) && set.has(n.slice(p.length))) return p.length; }
  return -1;
}
function isTitle(t){
  if(isLatin(t.w)) return LA_TITLES.has(t.n);
  if(prefLen(t.n,AR_TITLES)>=0) return true;
  const m=t.n.match(/^(?:و|ف)?لل(.+)$/);
  return !!(m && AR_TITLES.has('ال'+m[1]));
}

function tokenize(text){
  const re=/[\p{L}\p{M}]+(?:['’\-][\p{L}\p{M}]+)*/gu, out=[];
  let m; while((m=re.exec(text))) out.push({w:m[0],n:norm(m[0]),s:m.index,e:m.index+m[0].length});
  return out;
}
function gap(text,a,b,allowDot){
  const g=text.slice(a.e,b.s);
  return allowDot ? /^\.?[ \t ]+$/.test(g) || /^[ \t ]*$/.test(g)&&g.length>0 : /^[ \t ]+$/.test(g);
}

/* ---------- names ---------- */
function findNames(text){
  const T=tokenize(text), found=[];
  const stop=t=>isLatin(t.w)?LA_STOP.has(t.n):(AR_STOP.has(t.n)||prefLen(t.n,AR_ROLES)>=0);
  const role=t=>!isLatin(t.w)&&prefLen(t.n,AR_ROLES)>=0;
  for(let i=0;i<T.length;i++){
    const t=T[i];
    // 1) title + following words
    if((isTitle(t)||role(t)) && i+1<T.length && gap(text,t,T[i+1],true)){
      let j=i+1;
      while(j<T.length && (isTitle(T[j])||role(T[j])) && j+1<T.length && gap(text,T[j],T[j+1],true)) j++;
      const f=T[j];
      if(!f||stop(f)||isTitle(f)) continue;
      const latin=isLatin(f.w);
      /* after a role word, accept only a known first name or a word that is not a common ال- noun */
      if(!latin && f.n.startsWith('ال') && !AR_FIRST.has(f.n)) continue;
      /* after a role word (المشتكي، المتهم…) only a known first name or عبد/أبو + name counts */
      if(!latin && role(T[j-1]) && !isTitle(T[j-1]) && !AR_FIRST.has(f.n) && !/^(عبد|ابو)$/.test(f.n)){
        const nx=T[j+1], fam=nx && gap(text,f,nx) && !stop(nx) && ((nx.n.startsWith('بن')&&nx.n.length>=4)||(nx.n.startsWith('ال')&&/ي$/.test(nx.n)));
        if(!fam) continue;
      }
      if(latin && !isCap(f.w)) continue;
      let last=j,count=1,k=j+1;
      while(k<T.length && gap(text,T[k-1],T[k])){
        const x=T[k];
        const conn=latin?LA_CONN.has(x.n):AR_CONN.has(x.n);
        if(conn && k+1<T.length && gap(text,x,T[k+1]) && !stop(T[k+1])){ last=k+1; k+=2; continue; }
        if(stop(x)||isTitle(x)||count>=3) break;
        if(!latin && count>=2 && !(x.n.startsWith('ال')||x.n.startsWith('بن'))) break;
        if(latin && !isCap(x.w)) break;
        if(!latin && isLatin(x.w)) break;
        last=k; count++; k++;
      }
      found.push(text.slice(f.s,T[last].e)); i=last; continue;
    }
    // 2) known first names
    const latin=isLatin(t.w);
    let pl=-1, last=i, compound=false;
    if(latin){ if(isCap(t.w) && LA_FIRST.has(t.n)) pl=0; }
    else{
      pl=prefLen(t.n,AR_FIRST);
      if(pl<0){ const c=prefLen(t.n,S('عبد أبو')); if(c>=0 && i+1<T.length && gap(text,t,T[i+1]) && T[i+1].n.startsWith('ال')){pl=c;compound=true;last=i+1;} }
    }
    if(pl<0) continue;
    let count=compound?2:1, k=last+1;
    while(k<T.length && gap(text,T[k-1],T[k]) && count<3){
      const x=T[k];
      if(latin){
        if(!isLatin(x.w)) break;
        if(LA_CONN.has(x.n) && k+1<T.length && gap(text,x,T[k+1]) && isCap(T[k+1].w) && !LA_STOP.has(T[k+1].n)){ last=k+1; k+=2; count++; continue; }
        if(isCap(x.w) && !LA_STOP.has(x.n) && !LA_TITLES.has(x.n)){ last=k; k++; count++; continue; }
        break;
      }else{
        if(isLatin(x.w)) break;
        if(AR_CONN.has(x.n) && k+1<T.length && gap(text,x,T[k+1]) && !AR_STOP.has(T[k+1].n)){ last=k+1; k+=2; count++; continue; }
        if(stop(x)||isTitle(x)) break;
        if((x.n.startsWith('ال')&&x.n.length>=4) || (x.n.startsWith('بن')&&x.n.length>=4) || AR_FIRST.has(x.n)){ last=k; k++; count++; continue; }
        break;
      }
    }
    let start=t.s+pl;
    if(latin && i>0 && isAllCaps(T[i-1].w) && !LA_STOP.has(T[i-1].n) && !LA_TITLES.has(T[i-1].n) && gap(text,T[i-1],t)) start=T[i-1].s;
    found.push(text.slice(start,T[last].e)); i=last;
  }
  return found;
}

function escRe(s){return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');}
function fuzzy(s){
  return s.trim().split(/\s+/).map(w=>[...w].map(ch=>{
    if('اأإآٱ'.includes(ch)) return '[اأإآٱ]';
    if('هة'.includes(ch)) return '[هة]';
    if('يى'.includes(ch)) return '[يى]';
    return escRe(ch);
  }).join('')).join('[\\s\\u00A0]+');
}

/* ---------- state ---------- */
const $=id=>document.getElementById(id);
const src=$('src'), out=$('out'), custom=$('custom');
const kept=new Set();
let plain='';
function store(k,v){try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k,v);}catch(e){return null;}}

function run(){
  const text=src.value;
  const spans=[], items=new Map();
  const overlaps=(s,e)=>spans.some(x=>s<x.e && e>x.s);
  const note=(key,text,isKept)=>{
    if(!items.has(key)) items.set(key,{key,text,count:0,kept:isKept});
    items.get(key).count++;
  };
  const extra=custom.value.split('\n').map(x=>x.trim()).filter(x=>x.length>=2);
  const full=[...extra,...findNames(text)];
  const groups=new Map();
  for(const f of full){ const k=norm(f); if(k.length>=2 && !groups.has(k)) groups.set(k,f); }
  const lookup=new Map(), shown=[];
  for(const [k,f] of groups){
    if(kept.has(k)){ note(k,f,true); continue; }
    lookup.set(k,k); shown.push(f);
  }
  for(const [k,f] of groups){
    if(kept.has(k)) continue;
    for(const w of f.split(/\s+/)){
      const n=norm(w);
      if(n.length<3||lookup.has(n)||AR_CONN.has(n)||LA_CONN.has(n)||AR_STOP.has(n)||LA_STOP.has(n)||AR_ROLES.has(n)||AR_TITLES.has(n)||LA_TITLES.has(n)) continue;
      lookup.set(n,k); shown.push(w);
    }
  }
  if(shown.length){
    const alts=[...new Set(shown)].sort((a,b)=>b.length-a.length).map(fuzzy).join('|');
    const re=new RegExp('(?<!['+LT+'])('+AR_PREF.join('|')+')?('+alts+')(?!['+LT+'])','giu');
    let m;
    while((m=re.exec(text))){
      const word=m[2], key=lookup.get(norm(word));
      if(!key){ re.lastIndex=m.index+1; continue; }
      if(/^[a-z]/.test(word)) continue;
      const pre=m[1]||'';
      /* a lone و/ف before the name stays so the sentence still reads; ب/ل/ك go with the name */
      const keepPre=/^[وف]/.test(pre)?1:0;
      const s=m.index+keepPre, e=m.index+pre.length+word.length;
      if(overlaps(s,e)) continue;
      spans.push({s,e,key}); note(key,groups.get(key),false);
    }
  }
  spans.sort((a,b)=>a.s-b.s);

  /* remove each name and tidy the spaces around it */
  const PUNCT=/[،,.:;؛!?)\]»"]/;
  let p='', pos=0;
  for(const sp of spans){
    let s=sp.s, e=sp.e;
    const before=text[s-1], after=text[e];
    let chunk=text.slice(pos,s);
    if(after===undefined||after==='\n'||after===' '||PUNCT.test(after)){
      chunk=chunk.replace(/[ \t ]+$/,'');
      if(after===' ' && (chunk===''||/\n$/.test(chunk)||/[(«"\[]$/.test(chunk))) e++;
    }
    p+=chunk; pos=e;
  }
  p+=text.slice(pos);
  p=p.replace(/[ \t ]{2,}/g,' ').replace(/[ \t ]+([،,.:;؛!?)])/g,'$1')
     .replace(/([،,])\s*([،,])/g,'$1').replace(/\(\s*\)/g,'').replace(/^[ \t]+/gm,'');
  plain=p; out.textContent=p;
  $('count').textContent=groups.size-[...items.values()].filter(i=>i.kept).length>0 ? '· حُذف '+spans.length : '';

  const chips=$('chips'); chips.textContent='';
  for(const [key,it] of items){
    const b=document.createElement('button');
    b.type='button'; b.className='chip'+(it.kept?' kept':'');
    b.title=it.kept?'اضغط لحذفه من النص':'اضغط لإبقائه في النص';
    const k=document.createElement('span'); k.className='k'; k.textContent=it.kept?'باقٍ':'محذوف';
    const v=document.createElement('span'); v.className='v'; v.textContent=it.text;
    b.append(k,v);
    b.addEventListener('click',()=>{ kept.has(key)?kept.delete(key):kept.add(key); run(); });
    chips.append(b);
  }
  $('found').hidden=items.size===0;
}

let tm; const later=()=>{clearTimeout(tm);tm=setTimeout(run,120);};
src.addEventListener('input',later);
custom.addEventListener('input',()=>{store('mimha-custom',custom.value);later();});
/* pasting always replaces the old text */
src.addEventListener('paste',e=>{
  const t=e.clipboardData&&e.clipboardData.getData('text');
  if(t==null||t==='') return;
  e.preventDefault(); src.value=t; kept.clear(); run();
});
$('paste').addEventListener('click',()=>{
  const fallback=()=>{ src.focus(); src.select(); toast('ألصق الآن: سيُعوَّض النص القديم'); };
  if(navigator.clipboard&&navigator.clipboard.readText){
    navigator.clipboard.readText().then(t=>{ if(!t){fallback();return;} src.value=t; kept.clear(); run(); toast('تم اللصق'); },fallback);
  }else fallback();
});

function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('on');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),1800);}
function fallbackCopy(){
  const ta=document.createElement('textarea'); ta.value=plain; ta.setAttribute('readonly','');
  ta.style.position='fixed'; ta.style.opacity='0'; document.body.append(ta); ta.select();
  let ok=false; try{ok=document.execCommand('copy');}catch(e){}
  ta.remove();
  if(ok) toast('تم النسخ');
  else{ const r=document.createRange(); r.selectNodeContents(out); const s=getSelection(); s.removeAllRanges(); s.addRange(r); toast('النص محدد، انسخه يدوياً'); }
}
$('copy').addEventListener('click',()=>{
  if(!plain){toast('لا يوجد نص للنسخ');return;}
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(plain).then(()=>toast('تم النسخ'),fallbackCopy);
  }else fallbackCopy();
});
$('clear').addEventListener('click',()=>{src.value='';kept.clear();run();src.focus();});

const c=store('mimha-custom'); if(c){custom.value=c; $('more').open=true;}

src.value='';
run();
})();
</script>
